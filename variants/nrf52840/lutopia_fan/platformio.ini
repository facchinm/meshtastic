; Lutopia Fan Mother board: XIAO nRF52840 + SX1262 + round TFT + microSD
[env:lutopia_fan]
custom_meshtastic_hw_model = 88
custom_meshtastic_hw_model_slug = LUTOPIA_FAN
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Lutopia Fan
custom_meshtastic_tags = XIAO,Custom

extends = nrf52840_base
board = lutopia_fan
board_level = pr
build_flags = ${nrf52840_base.build_flags}
  -UOLEDDISPLAY_REDUCE_MEMORY
  -I variants/nrf52840/lutopia_fan
  -I src/platform/nrf52/softdevice
  -I src/platform/nrf52/softdevice/nrf52
  -DLUTOPIA_FAN
  -DCONFIG_NFCT_PINS_AS_GPIOS=1
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/lutopia_fan>
debug_tool = jlink
; If not set we will default to uploading over serial (first it forces bootloader entry by talking 1200bps to cdcacm)
;upload_protocol = jlink
lib_deps =
  ${nrf52840_base.lib_deps}
  arduino-libraries/SD@1.3.0
  # renovate: datasource=git-refs depName=meshtastic-st7789 packageName=https://github.com/meshtastic/st7789 gitBranch=main
  https://github.com/meshtastic/st7789/archive/92bae2e4a307afb430c3b0bc3d661c55ee1565f0.zip
